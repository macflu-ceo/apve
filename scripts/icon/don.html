<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#eef1f5;font-family:-apple-system,sans-serif;display:flex;flex-wrap:wrap;gap:22px;padding:24px;width:1180px}
  .card{background:#fff;border-radius:26px;width:352px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.06);position:relative;overflow:hidden}
  .lab{position:absolute;bottom:14px;color:#556;font-size:14px;font-weight:700}
  .don{color:#e5623f;line-height:1;font-weight:400;position:relative}
  .spark{position:absolute;color:#e5623f}
  /* 스타일별 */
  .s1{font-family:"Nanum Brush Script";font-size:200px;transform:skewX(-10deg)}
  .s2{font-family:"GungSeo";font-size:180px;transform:skewX(-8deg) rotate(-4deg)}
  .s3{font-family:"PilGi";font-size:200px;transform:skewX(-12deg)}
  .s4{font-family:"BM Kirang Haerang";font-size:200px}
  .s5{font-family:"Nanum Brush Script";font-size:210px;transform:rotate(-8deg) scaleY(1.15)}
  .s6{font-family:"GungSeo";font-size:170px;letter-spacing:-10px;transform:skewX(-10deg)}
</style>
<body>
  <div class="card"><div class="don s1">돈</div><div class="spark" style="left:120px;top:70px;font-size:40px">✦</div><div class="lab">1 · 나눔손글씨 붓</div></div>
  <div class="card"><div class="don s2">돈</div><div class="spark" style="left:110px;top:80px;font-size:36px">✦</div><div class="lab">2 · 궁서 (기울임)</div></div>
  <div class="card"><div class="don s3">돈</div><div class="spark" style="left:120px;top:70px;font-size:40px">✦</div><div class="lab">3 · 필기체</div></div>
  <div class="card"><div class="don s4">돈</div><div class="spark" style="left:120px;top:75px;font-size:40px">✦</div><div class="lab">4 · 기랑해랑</div></div>
  <div class="card"><div class="don s5">돈</div><div class="spark" style="left:110px;top:60px;font-size:42px">✦</div><div class="lab">5 · 붓 (세로로 늘림)</div></div>
  <div class="card"><div class="don s6">돈</div><div class="spark" style="left:120px;top:80px;font-size:36px">✦</div><div class="lab">6 · 궁서 (좁게)</div></div>
</body>
