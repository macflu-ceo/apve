<!doctype html><meta charset=utf-8>
<style>
 body{margin:0;background:#eef1f5;display:flex;flex-wrap:wrap;gap:18px;padding:20px;width:820px;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
 .card{position:relative;width:380px;height:380px;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
 .card img{width:100%;height:100%;object-fit:cover;display:block}
 .grad{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.10) 40%, transparent 65%)}
 .txt{position:absolute;left:0;right:0;bottom:0;padding:22px}
 .h{color:#fff;font-size:26px;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
</style>
<div class=card><img src=hero1.jpg><div class=grad></div><div class=txt><div class=h>가을, 지금 입다</div></div></div>
<div class=card><img src=hero2.jpg><div class=grad></div><div class=txt><div class=h>오늘의 룩, 완성</div></div></div>
<div class=card><img src=hero3.jpg><div class=grad></div><div class=txt><div class=h>하나로 완성되는 격</div></div></div>
<div class=card><img src=hero4.jpg><div class=grad></div><div class=txt><div class=h>어짜피 살 거면, 여기서</div></div></div>
